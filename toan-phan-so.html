<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30 câu - Phân số bằng nhau lớp 4</title><style>body{font-family:Arial,sans-serif;background:#eef4fb;margin:0;color:#17324e}main{max-width:720px;margin:20px auto;padding:14px}header{background:#1765ac;color:white;padding:22px;border-radius:18px}h1{font-size:25px;margin:8px 0}article{background:white;padding:22px;border-radius:18px;margin-top:16px;box-shadow:0 2px 12px #ccd7e3}#question{font-size:24px;font-weight:700;line-height:1.8;margin:24px 0}button{cursor:pointer;font-size:19px;border-radius:12px;padding:13px;border:2px solid #d5e3f1;background:white;color:#17324e}.answer{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0;min-height:62px}.answer:disabled{opacity:.65}.good{background:#d9f7e9!important;border-color:#168c5c!important}.bad{background:#ffe7e7!important;border-color:#c75c5c!important}.action{background:#1765ac;color:white;border:0;font-weight:bold;margin-top:15px}.action:disabled{background:#9fb3c5}#notice{font-weight:bold;min-height:28px;margin-top:14px}#meter{height:10px;background:#e2edf8;border-radius:20px;overflow:hidden}#bar{background:#15a99b;height:100%;width:0}#finish{display:none}.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;line-height:1.15;font-size:1.05em;min-width:36px;margin:0 4px}.frac .top{border-bottom:2px solid currentColor;padding:0 8px 5px;min-width:30px;text-align:center}.frac .bottom{padding:5px 8px 0;min-width:30px;text-align:center}.fraction-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.blank{display:inline-block;width:64px;min-height:36px;border:2px solid #2375b5;border-radius:7px;background:#f6fbff;vertical-align:middle;text-align:center;font-weight:700}.blank-input{box-sizing:border-box;width:74px;height:49px;padding:3px;border:2px solid #2375b5;border-radius:9px;font-size:26px;text-align:center;background:#f6fbff;color:#17324e}.frac .blank-input{width:72px;height:48px;vertical-align:middle}.blank-input:focus{outline:3px solid #b5d9ff}#entry{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}.muted{font-size:15px;color:#47637c}small{line-height:1.7}</style></head><body><main><header><b>TOÁN LỚP 4</b><h1>30 câu tìm phân số bằng nhau</h1><p>Phân số trình bày dạng tử số trên, mẫu số dưới. Chạm vào ô trống ở tử số hoặc mẫu số để nhập trực tiếp.</p></header><article id="quiz"><div id="info"></div><div id="meter"><div id="bar"></div></div><div id="question"></div><div id="answers"></div><div id="notice" aria-live="polite"></div><button id="next" class="action" disabled onclick="advance()">Câu tiếp theo →</button></article><article id="finish"><h2>🎉 Hoàn thành!</h2><h1 id="result"></h1><p>Chỉ tính điểm nếu đúng ngay lần đầu.</p><button class="action" onclick="restart()">Làm lại (đảo câu và đáp án)</button></article><p><small>30 câu · Mỗi câu tối đa 1 điểm · Chọn sai hoặc điền sai phải làm lại, không hiện đáp án.</small></p></main><script>const bank=[{"t": "Phân số nào bằng 1/2?", "a": ["2/4", "3/4", "2/5", "3/5"], "key": 0}, {"t": "Phân số nào bằng 2/3?", "a": ["6/9", "7/9", "6/10", "7/10"], "key": 0}, {"t": "Phân số nào bằng 3/4?", "a": ["6/8", "7/8", "6/9", "7/9"], "key": 0}, {"t": "Phân số nào bằng 2/5?", "a": ["8/20", "9/20", "8/21", "9/21"], "key": 0}, {"t": "Phân số nào bằng 3/7?", "a": ["9/21", "10/21", "9/22", "10/22"], "key": 0}, {"t": "Phân số nào bằng 4/9?", "a": ["8/18", "9/18", "8/19", "9/19"], "key": 0}, {"t": "Phân số nào bằng 5/6?", "a": ["15/18", "16/18", "15/19", "16/19"], "key": 0}, {"t": "Phân số nào bằng 3/8?", "a": ["12/32", "13/32", "12/33", "13/33"], "key": 0}, {"t": "Phân số nào bằng 7/10?", "a": ["14/20", "15/20", "14/21", "15/21"], "key": 0}, {"t": "Phân số nào bằng 5/12?", "a": ["15/36", "16/36", "15/37", "16/37"], "key": 0}, {"t": "Điền số vào ô trống: 1/3 = □/12", "a": ["4", "5", "3", "12"], "key": 0}, {"t": "Điền số vào ô trống: 2/7 = □/21", "a": ["6", "7", "5", "21"], "key": 0}, {"t": "Điền số vào ô trống: 3/5 = □/20", "a": ["12", "13", "11", "20"], "key": 0}, {"t": "Điền số vào ô trống: 4/7 = □/14", "a": ["8", "9", "7", "14"], "key": 0}, {"t": "Điền số vào ô trống: 5/8 = □/24", "a": ["15", "16", "14", "24"], "key": 0}, {"t": "Điền số vào ô trống: 2/9 = □/45", "a": ["10", "11", "9", "45"], "key": 0}, {"t": "Điền số vào ô trống: 3/10 = □/30", "a": ["9", "10", "8", "30"], "key": 0}, {"t": "Điền số vào ô trống: 7/12 = □/24", "a": ["14", "15", "13", "24"], "key": 0}, {"t": "Điền số vào ô trống: 2/3 = 10/□", "a": ["15", "16", "14", "10"], "key": 0}, {"t": "Điền số vào ô trống: 3/4 = 9/□", "a": ["12", "13", "11", "9"], "key": 0}, {"t": "Điền số vào ô trống: 4/5 = 16/□", "a": ["20", "21", "19", "16"], "key": 0}, {"t": "Điền số vào ô trống: 5/7 = 10/□", "a": ["14", "15", "13", "10"], "key": 0}, {"t": "Điền số vào ô trống: 3/8 = 12/□", "a": ["32", "33", "31", "12"], "key": 0}, {"t": "Điền số vào ô trống: 7/9 = 21/□", "a": ["27", "28", "26", "21"], "key": 0}, {"t": "Phân số nào KHÔNG bằng 1/2?", "a": ["4/6", "2/4", "3/6", "4/8"], "key": 0}, {"t": "Phân số nào KHÔNG bằng 2/3?", "a": ["7/9", "4/6", "6/9", "8/12"], "key": 0}, {"t": "Phân số nào KHÔNG bằng 3/5?", "a": ["7/10", "6/10", "9/15", "12/20"], "key": 0}, {"t": "Phân số nào KHÔNG bằng 4/7?", "a": ["9/14", "8/14", "12/21", "16/28"], "key": 0}, {"t": "Phân số nào KHÔNG bằng 5/9?", "a": ["11/18", "10/18", "15/27", "20/36"], "key": 0}, {"t": "Phân số nào KHÔNG bằng 3/8?", "a": ["10/24", "6/16", "9/24", "12/32"], "key": 0}];
let data=[],idx=0,score=0,failed=false,done=false;
const $=id=>document.getElementById(id);
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function frac(a,b){return '<span class="frac"><span class="top">'+(a==='□'?'<input id="fill" class="blank-input" type="number" inputmode="numeric" min="0" aria-label="Điền tử số" />':a)+'</span><span class="bottom">'+(b==='□'?'<input id="fill" class="blank-input" type="number" inputmode="numeric" min="0" aria-label="Điền mẫu số" />':b)+'</span></span>'}
function questionHtml(t){let match=t.match(/^(.*?):\s*(\d+)\/(\d+)\s*=\s*(□|\d+)\/(□|\d+)$/);if(match)return match[1]+':<div class="fraction-line">'+frac(match[2],match[3])+'<span>=</span>'+frac(match[4],match[5])+'</div>';let m=t.match(/^(.*?)(\d+)\/(\d+)(\?)$/);if(m)return m[1]+frac(m[2],m[3])+m[4];return t}
function restart(){data=mix(bank.map(q=>({t:q.t,fill:q.t.includes('□'),correct:q.a[q.key],choices:mix(q.a.map((v,i)=>({v,correct:i===q.key})))})));idx=0;score=0;$('quiz').style.display='block';$('finish').style.display='none';draw()}
function draw(){failed=false;done=false;let q=data[idx];$('info').textContent=`Câu ${idx+1}/30 — Điểm: ${score}/30`;$('bar').style.width=(idx/30*100)+'%';$('question').innerHTML=questionHtml(q.t);$('notice').textContent='';$('next').disabled=true;$('next').textContent=idx===29?'Xem kết quả →':'Câu tiếp theo →';let box=$('answers');box.replaceChildren();if(q.fill){let p=document.createElement('p');p.className='muted';p.textContent='Chạm vào ô trống ngay trong phân số để điền số, sau đó bấm Kiểm tra:';let wrap=document.createElement('div');wrap.id='entry';let inp=$('fill');inp.placeholder='?';let btn=document.createElement('button');btn.textContent='Kiểm tra';btn.onclick=()=>checkFill(inp,btn,q);inp.onkeydown=e=>{if(e.key==='Enter')checkFill(inp,btn,q)};wrap.append(btn);box.append(p,wrap)}else q.choices.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';let label=document.createElement('strong');label.textContent='ABCD'[i]+'.';let f=a.v.match(/^(\d+)\/(\d+)$/);b.append(label);if(f){let span=document.createElement('span');span.innerHTML=frac(f[1],f[2]);b.append(span)}else b.append(document.createTextNode(a.v));b.onclick=()=>choose(b,a);box.append(b)})}
function notice(correct){let n=$('notice');if(correct){done=true;if(!failed){score++;n.textContent='Chính xác! +1 điểm.'}else n.textContent='Đúng rồi! Không cộng điểm vì lần đầu chưa đúng.';n.style.color='#137a50';$('info').textContent=`Câu ${idx+1}/30 — Điểm: ${score}/30`;$('next').disabled=false}else{failed=true;n.textContent='Chưa đúng, hãy thử lại!';n.style.color='#b33b3b'}}
function choose(b,a){if(done)return;if(a.correct){b.classList.add('good');notice(true);document.querySelectorAll('.answer').forEach(x=>x.disabled=true)}else{b.classList.add('bad');b.disabled=true;notice(false)}}
function checkFill(inp,btn,q){if(done)return;let v=inp.value.trim();if(!/^\d+$/.test(v)){let n=$('notice');n.textContent='Em hãy nhập một số tự nhiên vào ô trống.';n.style.color='#b33b3b';return}if(Number(v)===Number(q.correct)){notice(true);inp.disabled=true;btn.disabled=true;inp.style.background='#d9f7e9'}else{notice(false);inp.value='';inp.focus()}}
function advance(){if(!done)return;idx++;if(idx===30){$('quiz').style.display='none';$('finish').style.display='block';$('result').textContent=score+'/30 điểm'}else draw()}restart();</script></body></html>
